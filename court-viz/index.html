<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoop Hub Concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #14264e;
    --gold: #fba91a;
    --white: #ffffff;
    --light: #f8fafc;
    --gray: #334155;
    --panel: rgba(20, 38, 78, 0.92);
    --bg: #c9d3dc;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0e1a36; }
  }
  :root[data-theme="dark"] { --bg: #0e1a36; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); font-family: Montserrat, system-ui, sans-serif; color: var(--white); }
  #view { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  .bar {
    position: fixed; top: calc(16px + env(safe-area-inset-top, 0px));
    left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 10px 12px; border-radius: 1.5rem; background: var(--panel);
    box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.1);
  }
  .bar h1 { font-family: 'Lilita One', sans-serif; font-weight: 400; text-transform: uppercase; font-size: 18px; letter-spacing: 0.5px; margin: 0 8px 0 4px; white-space: nowrap; }
  .bar h1 span { color: var(--gold); }
  .group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .sep { width: 1px; height: 24px; background: rgba(255, 255, 255, 0.2); margin: 0 4px; }
  button, .toggle {
    font: 700 11px Montserrat, sans-serif; text-transform: uppercase; letter-spacing: 0.4px;
    color: var(--white); background: transparent; border: 2px solid rgba(255, 255, 255, 0.35);
    border-radius: 999px; padding: 6px 11px; cursor: pointer;
  }
  button:hover { border-color: var(--gold); }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  button.on { background: var(--gold); color: var(--navy); border-color: var(--gold); }
  label.slider { display: flex; align-items: center; gap: 6px; font: 700 11px Montserrat, sans-serif; text-transform: uppercase; }
  input[type=range] { accent-color: var(--gold); width: 110px; }
  .concept {
    position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); padding: 6px 12px; border-radius: 6px;
    background: rgba(20, 38, 78, 0.6); font: 700 12px Montserrat, sans-serif; letter-spacing: 0.4px;
  }
  .hint { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); font: 600 11px Montserrat, sans-serif; color: var(--white); opacity: 0.85; text-shadow: 0 1px 2px rgba(0,0,0,0.6); }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; font: 700 14px Montserrat, sans-serif; color: var(--navy); }
  body.render .bar, body.render .concept, body.render .hint { display: none; }
  @media (max-width: 720px) {
    .bar { padding: 8px; gap: 6px; }
    button, .toggle { padding: 5px 9px; font-size: 10px; }
    .bar h1 { font-size: 15px; width: 100%; }
    .sep { display: none; }
    .hint { display: none; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="view"></div>
<div class="loading" id="loading">Building the court…</div>
<div class="bar">
  <h1>Hoop Hub <span>Phase 1</span></h1>
  <div class="group" id="shots"></div>
  <div class="sep"></div>
  <div class="group">
    <button id="mini">Hoops out</button>
    <button id="doors">Container open</button>
    <button id="pad">Pad: navy</button>
    <button id="wrap">Wrap: navy</button>
    <label class="slider">Rim <input id="rim" type="range" min="5" max="10" step="0.5" value="10"> <span id="rimv">10 ft</span></label>
    <button id="fly">Fly-through</button>
    <button id="install">Installation</button>
  </div>
</div>
<div class="concept">CONCEPT - NOT A REAL INSTALL</div>
<div class="hint">Drag to orbit · scroll to zoom</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { createHoopHub, SHOTS } from './scene.js';
import { FLY, SEGMENTS, sampleFly, sampleSegment } from './flythrough.js';
import { INSTALL, sampleInstall } from './install.js';

const params = new URLSearchParams(location.search);
const renderMode = params.has('shot') || params.has('fly');
if (renderMode) document.body.classList.add('render');
const W = +params.get('w') || innerWidth;
const H = +params.get('h') || innerHeight;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: renderMode });
renderer.setPixelRatio(renderMode ? 1 : Math.min(devicePixelRatio, 2));
renderer.setSize(W, H, !renderMode);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('view').appendChild(renderer.domElement);

const hub = await createHoopHub(renderer, { logoUrl: 'assets/logo.png' });
const { scene } = hub;
document.getElementById('loading').remove();

const persp = new THREE.PerspectiveCamera(40, W / H, 0.1, 3000);
const ortho = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 200);
let camera = persp;

const useAO = renderMode && params.get('ao') !== '0';
let composer = null;
let bokeh = null;
function buildComposer() {
  if (!useAO) return;
  const rt = new THREE.WebGLRenderTarget(W, H, { type: THREE.HalfFloatType, samples: 4 });
  composer = new EffectComposer(renderer, rt);
  composer.setSize(W, H);
  composer.addPass(new RenderPass(scene, camera));
  const ao = new GTAOPass(scene, camera, W, H);
  ao.updateGtaoMaterial({ radius: 0.6, distanceExponent: 1.5, thickness: 1, scale: 1 });
  ao.blendIntensity = 0.75;
  composer.addPass(ao);
  bokeh = new BokehPass(scene, camera, { focus: 10, aperture: 0.00012, maxblur: 0.004 });
  bokeh.enabled = false;
  composer.addPass(bokeh);
  composer.addPass(new OutputPass());
}

const controls = renderMode ? null : new OrbitControls(persp, renderer.domElement);
if (controls) {
  controls.enableDamping = true;
  controls.maxPolarAngle = Math.PI / 2 - 0.03;
  controls.minDistance = 2;
  controls.maxDistance = 80;
}

function setShot(id) {
  const s = SHOTS[id];
  // every shot starts from the finished court, then applies its own state
  hub.apply({ rollOut: 0, floor: hub.nPanels, kit: 'inuse', install: null, ...s.state });
  if (s.ortho) {
    const { cx, cz, height } = s.ortho;
    const aspect = W / H;
    ortho.left = (-height * aspect) / 2;
    ortho.right = (height * aspect) / 2;
    ortho.top = height / 2;
    ortho.bottom = -height / 2;
    ortho.position.set(cx, 60, cz);
    ortho.up.set(0, 0, -1);
    ortho.lookAt(cx, 0, cz);
    ortho.updateProjectionMatrix();
    camera = ortho;
  } else {
    persp.fov = s.fov;
    persp.position.set(...s.pos);
    persp.updateProjectionMatrix();
    camera = persp;
    if (controls) {
      controls.target.set(...s.target);
      controls.update();
    } else persp.lookAt(...s.target);
  }
  if (bokeh) {
    bokeh.enabled = !!s.dof;
    if (s.dof) bokeh.uniforms.focus.value = s.dof;
  }
  syncUI();
}

function render() {
  if (composer) {
    composer.passes.forEach((p) => p.camera !== undefined && (p.camera = camera));
    if (bokeh) bokeh.camera = camera;
    composer.render();
  } else renderer.render(scene, camera);
}

// ---------- UI
const shotBar = document.getElementById('shots');
const shotIds = ['1', '2', '3c', '4', '5', '6'];
for (const id of shotIds) {
  const b = document.createElement('button');
  b.textContent = SHOTS[id].label;
  b.dataset.shot = id;
  b.onclick = () => { stopFly(); setShot(id); };
  shotBar.appendChild(b);
}
const $ = (id) => document.getElementById(id);
function syncUI() {
  $('mini').classList.toggle('on', hub.state.mini);
  $('doors').classList.toggle('on', hub.state.doors > 0.5);
  $('pad').textContent = `Pad: ${hub.state.padding}`;
  $('wrap').textContent = `Wrap: ${hub.state.wrap}`;
  $('rim').value = hub.state.rimFt;
  $('rimv').textContent = `${hub.state.rimFt} ft`;
}
$('mini').onclick = () => { hub.apply({ mini: !hub.state.mini, rollOut: 0 }); syncUI(); };
$('doors').onclick = () => { hub.apply({ doors: hub.state.doors > 0.5 ? 0 : 1 }); syncUI(); };
$('pad').onclick = () => { hub.apply({ padding: hub.state.padding === 'gold' ? 'navy' : 'gold' }); syncUI(); };
$('wrap').onclick = () => { hub.apply({ wrap: hub.state.wrap === 'gold' ? 'navy' : 'gold' }); syncUI(); };
$('rim').oninput = (e) => { hub.apply({ rimFt: +e.target.value }); syncUI(); };

let flyT0 = null;
let installT0 = null;
function stopFly() {
  flyT0 = null;
  $('fly').classList.remove('on');
  if (installT0 !== null) { installT0 = null; hub.apply({ install: null }); }
  $('install').classList.remove('on');
  if (controls) controls.enabled = true;
}
$('install').onclick = () => {
  if (installT0 !== null) return stopFly();
  stopFly();
  installT0 = performance.now();
  $('install').classList.add('on');
  controls.enabled = false;
  camera = persp;
};
$('fly').onclick = () => {
  if (flyT0 !== null) return stopFly();
  flyT0 = performance.now();
  $('fly').classList.add('on');
  controls.enabled = false;
  camera = persp;
};
function applyFly(t) {
  const f = sampleFly(t);
  hub.apply(f.state);
  persp.fov = f.fov;
  persp.position.copy(f.pos);
  persp.lookAt(f.target);
  persp.updateProjectionMatrix();
  return f;
}

addEventListener('resize', () => {
  if (renderMode) return;
  renderer.setSize(innerWidth, innerHeight);
  persp.aspect = innerWidth / innerHeight;
  persp.updateProjectionMatrix();
});

// ---------- render-mode hooks for the still and video exporter
window.hub = hub;
window.renderShot = (id, extra) => { setShot(id); if (extra) hub.apply(extra); render(); };
window.renderFly = (t) => { camera = persp; applyFly(t); render(); };
window.renderSeg = (i, t) => {
  camera = persp;
  const f = sampleSegment(i, t);
  hub.apply(f.state);
  persp.fov = f.fov;
  persp.position.copy(f.pos);
  persp.lookAt(f.target);
  persp.updateProjectionMatrix();
  if (bokeh) bokeh.enabled = false;
  render();
};
window.SEGMENTS = SEGMENTS.map((s) => ({ name: s.name, duration: s.duration }));
window.INSTALL_DURATION = INSTALL.duration;
function applyInstallCam(t) {
  const f = sampleInstall(t);
  hub.apply({ install: t });
  persp.fov = f.fov;
  persp.position.copy(f.pos);
  persp.lookAt(f.target);
  persp.updateProjectionMatrix();
  return f;
}
window.renderInstall = (t) => {
  camera = persp;
  applyInstallCam(t);
  if (bokeh) bokeh.enabled = false;
  render();
};
window.FLY_DURATION = FLY.duration;

if (renderMode) {
  persp.aspect = W / H;
  buildComposer();
  if (params.has('shot')) {
    const extra = params.get('state');
    setShot(params.get('shot'));
    if (extra) hub.apply(JSON.parse(extra));
    render();
  }
  window.__ready = true;
} else {
  setShot('1');
  window.__ready = true;
  renderer.setAnimationLoop(() => {
    if (installT0 !== null) {
      const t = (performance.now() - installT0) / 1000;
      if (t > INSTALL.duration) { const f = applyInstallCam(INSTALL.duration); stopFly(); controls.target.copy(f.target); }
      else applyInstallCam(t);
    } else if (flyT0 !== null) {
      const t = (performance.now() - flyT0) / 1000;
      if (t > FLY.duration) { stopFly(); controls.target.copy(applyFly(FLY.duration).target); }
      else applyFly(t);
    } else controls.update();
    render();
  });
}
</script>
</body>
</html>
